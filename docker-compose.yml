services:
  tradereplay:
    build:
      context: .
      dockerfile: Dockerfile
    image: tradereplay:latest
    container_name: tradereplay
    ports:
      - "${TRADEREPLAY_PORT:-8081}:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

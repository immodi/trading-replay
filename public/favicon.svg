<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="TradeReplay">
    <title>TradeReplay</title>
    <rect x="1" y="1" width="62" height="62" rx="14" fill="#0b0e14" stroke="#232b3a" stroke-width="2" />

    <!-- Replay arrow looping over a rising candle chart -->
    <path d="M15 25 C15 7 49 7 49 25" fill="none" stroke="#3d7eff" stroke-width="5" stroke-linecap="round" />
    <path d="M44.5 20.5 L49 28.5 L53.5 20.5 Z" fill="#3d7eff" />

    <!-- Bearish candle -->
    <line x1="22" y1="32" x2="22" y2="54" stroke="#ef5350" stroke-width="3.5" stroke-linecap="round" />
    <rect x="17" y="38" width="10" height="12" rx="2" fill="#ef5350" />

    <!-- Bullish candle, higher close -->
    <line x1="42" y1="30" x2="42" y2="50" stroke="#26a69a" stroke-width="3.5" stroke-linecap="round" />
    <rect x="37" y="34" width="10" height="13" rx="2" fill="#26a69a" />
</svg>
